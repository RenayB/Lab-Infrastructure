name: Terraform Deploy - S3 (bootstrap)

# This stack creates the S3 bucket every other stack stores its remote state
# in, so it intentionally has no remote backend of its own (see s3/main.tf).
# That means this workflow has no persistent state between runs: state only
# lives for the duration of a single run, passed from plan -> apply via the
# uploaded artifact below. After apply succeeds, download the "tfstate-s3"
# artifact from the run and keep it somewhere durable (e.g. commit it to a
# private location or migrate the stack to a remote backend) before running
# this workflow again, otherwise Terraform won't know the bucket already
# exists and re-running plan/apply will try to recreate it.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.6.6"
  AWS_REGION: us-east-2
  ROLE_TO_ASSUME: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
  WORKING_DIRECTORY: s3

jobs:
  plan:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # No remote backend for this stack - local state only.
      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -var-file=tfvars/renays-lab.tfvars -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-s3
          path: ${{ env.WORKING_DIRECTORY }}/tfplan
          retention-days: 1

  apply:
    name: Terraform Apply (Manual Approval)
    needs: plan
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-s3
          path: ${{ env.WORKING_DIRECTORY }}

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Upload State
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfstate-s3
          path: ${{ env.WORKING_DIRECTORY }}/terraform.tfstate
          retention-days: 30
